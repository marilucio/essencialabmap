# Build configuration for main site
[build]
  base = "."
  publish = "dist"
  command = "npm run build"

# Build configuration for metodocalma subdirectory
[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20"

# Função do funil /map/comecar (netlify/functions/map-funil-lead.mts): grava o lead
# no Supabase da landing e envia o e-mail do plano. Variáveis em .env.example.
[functions]
  directory = "netlify/functions"

# Serve metodocalma assets
[[redirects]]
  from = "/metodocalma/assets/*"
  to = "/metodocalma/assets/:splat"
  status = 200

# Serve autobot landing page
[[redirects]]
  from = "/autobot"
  to = "/autobot/index.html"
  status = 200

[[redirects]]
  from = "/autobot/"
  to = "/autobot/index.html"
  status = 200

# /map: HTML dedicado com meta tags/OG proprias (ver map.html)
[[redirects]]
  from = "/map"
  to = "/map.html"
  status = 200

[[redirects]]
  from = "/map/"
  to = "/map.html"
  status = 200

# Funil /map/comecar: HTML próprio (map-comecar.html); as telas internas usam o mesmo HTML
[[redirects]]
  from = "/map/comecar"
  to = "/map-comecar.html"
  status = 200

[[redirects]]
  from = "/map/comecar/*"
  to = "/map-comecar.html"
  status = 200

# SPA fallback for main site (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200