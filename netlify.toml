# Build configuration for main site
[build]
  base = "."
  publish = "dist"
  command = "npm run build"

# Build configuration for metodocalma subdirectory
[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20"

# Função do funil /map/comecar (netlify/functions/map-funil-lead.mts): grava o lead
# no Supabase da landing e envia o e-mail do plano. Variáveis em .env.example.
[functions]
  directory = "netlify/functions"

# As regras de rota ficam todas em public/_redirects (uma fonte só, para a ordem
# entre páginas pré-renderizadas, funis e o 404 não se perder entre dois arquivos).
