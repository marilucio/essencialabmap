# Build configuration for main site
[build]
  base = "."
  publish = "dist"
  command = "npm run build"

# Build configuration for metodocalma subdirectory
[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20"
  # Supabase das páginas /renal. Apenas a chave anônima (pública, vai no bundle).
  # Segredos nunca entram aqui nem em variáveis VITE_*.
  VITE_SUPABASE_URL = "https://vbdirkokkxvlphyenjko.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiZGlya29ra3h2bHBoeWVuamtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzEzMzc5NjksImV4cCI6MjA0NjkxMzk2OX0.xSBblvnrmJuPGLCsSix1UGR31kD139nP34Iije8wiRM"

# Serve metodocalma assets
[[redirects]]
  from = "/metodocalma/assets/*"
  to = "/metodocalma/assets/:splat"
  status = 200

# Serve autobot landing page
[[redirects]]
  from = "/autobot"
  to = "/autobot/index.html"
  status = 200

[[redirects]]
  from = "/autobot/"
  to = "/autobot/index.html"
  status = 200

# /map: HTML dedicado com meta tags/OG proprias (ver map.html)
[[redirects]]
  from = "/map"
  to = "/map.html"
  status = 200

[[redirects]]
  from = "/map/"
  to = "/map.html"
  status = 200

# SPA fallback for main site (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200