<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/map/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/map/brand/favicon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/map/brand/favicon-192.png" />
    <link rel="shortcut icon" href="/images/map/brand/favicon-32.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/map/manrope-600-latin.woff2" crossorigin />

    <!-- Head dedicado da rota /map. Servido pelo redirect /map -> /map.html (Netlify),
         para que WhatsApp e o scraper da Meta recebam as tags sem executar JS. -->
    <title>EssenciaLab MAP — organize a consulta e acompanhe os retornos</title>
    <meta
      name="description"
      content="Reúna relatos, sintomas, exames e histórico para preparar a consulta e acompanhar os retornos. Criado e usado no consultório por Marilúcio Rocha. Teste de 14 dias, sem cartão."
    />
    <meta name="author" content="Marilúcio Rocha" />
    <link rel="canonical" href="https://essencialab.site/map" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="EssenciaLab" />
    <meta property="og:url" content="https://essencialab.site/map" />
    <meta property="og:title" content="EssenciaLab MAP — chegue à consulta com o caso organizado" />
    <meta
      property="og:description"
      content="Relatos, sintomas, exames e histórico no mesmo lugar. Prepare o atendimento e enxergue o que mudou no retorno. Criado por quem atende. Teste de 14 dias, sem cartão."
    />
    <meta property="og:image" content="https://essencialab.site/images/map/og-map.jpg" />
    <meta property="og:image:secure_url" content="https://essencialab.site/images/map/og-map.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Telas do EssenciaLab MAP com a frase: ela responde antes da consulta, você chega sabendo o que já existe e o que ainda falta" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EssenciaLab MAP — organize a consulta e acompanhe os retornos" />
    <meta name="twitter:description" content="Para nutricionistas, naturopatas e terapeutas integrativos. Relatos, exames e histórico no mesmo lugar. Teste de 14 dias, sem cartão." />
    <meta name="twitter:image" content="https://essencialab.site/images/map/og-map.jpg" />

    <!-- LCP: poster do vídeo -->
    <link rel="preload" as="image" href="/images/map/video-poster.webp" imagesrcset="/images/map/video-poster-640.webp 640w, /images/map/video-poster.webp 1280w" imagesizes="(min-width: 1024px) 560px, 100vw" fetchpriority="high" />

    <!-- Meta Pixel da landing /map (VITE_META_PIXEL_ID_MAP, substituído no build;
         o vite build falha se faltar). PageView aqui; StartTrial e os eventos das
         campanhas saem dos CTAs (src/pages/map/tracking.ts, src/lib/tracking.ts). -->
    <script>
      (function () {
      var pixelId = "%VITE_META_PIXEL_ID_MAP%";
      if (!/^\d+$/.test(pixelId)) {
        console.warn("[Meta Pixel] VITE_META_PIXEL_ID_MAP ausente; pixel não iniciado.");
        return;
      }
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = true;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", pixelId);
      fbq("track", "PageView");
      })();
    </script>
  </head>
  <body>
    <noscript
      ><img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID_MAP%&ev=PageView&noscript=1"
        alt=""
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/map-main.jsx"></script>
  </body>
</html>
