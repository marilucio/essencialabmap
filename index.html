<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon (nova identidade) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/map/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/map/brand/favicon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/map/brand/favicon-192.png" />
    <link rel="shortcut icon" href="/images/map/brand/favicon-32.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/map/manrope-600-latin.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Básico -->
    <title>EssenciaLab — Atraia e Fidelize Clientes com Análise Facial | Para Consultores de Bem-Estar</title>
    <meta
      name="description"
      content="A ferramenta que transforma a câmera do celular em porta de entrada para novos clientes. Análise facial gera mapas de bem-estar personalizados e abre conversas naturais. Teste grátis 14 dias."
    />
    <meta
      name="keywords"
      content="análise facial, prospecção de clientes, consultores de bem-estar, aromaterapia, fidelização de clientes, óleos essenciais, ferramenta para consultores"
    />
    <meta name="author" content="Marilúcio Rocha" />

    <!-- Open Graph / Facebook -->
    <!--
      NOTA: as tags OG permanecem em pt-BR (idioma padrão). Crawlers de preview
      de link (WhatsApp, Facebook) não executam JS, então esta é uma limitação
      estrutural de SPA — não há como variar og:title/description/image por
      idioma sem SSR/prerender ou rotas dedicadas (/en, /es). Decisão registrada.
    -->
    <meta
      property="og:title"
      content="EssenciaLab — A ferramenta que atrai clientes novos e fideliza os antigos"
    />
    <meta
      property="og:description"
      content="Análise facial que gera mapas de bem-estar e abre conversas naturais com clientes. Usada por centenas de consultores. Teste grátis por 14 dias, sem cartão."
    />
    <meta property="og:image" content="https://essencialab.site/capa-meta-2026-10.jpg" />
    <meta property="og:image:secure_url" content="https://essencialab.site/capa-meta-2026-10.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://essencialab.site/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="EssenciaLab" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="EssenciaLab — A ferramenta que atrai clientes novos e fideliza os antigos"
    />
    <meta
      name="twitter:description"
      content="Análise facial que gera mapas de bem-estar e abre conversas naturais com clientes. Usada por centenas de consultores. Teste grátis por 14 dias, sem cartão."
    />
    <meta name="twitter:image" content="https://essencialab.site/capa-meta-2026-10.jpg" />

    <!-- AOS - Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Meta Pixel: um pixel por grupo de rotas. Os IDs entram no build por
         %VITE_…% (.env.production / variáveis da Netlify); o vite build falha
         se faltar algum (vite.config.mjs). Rotas fora das listas: nenhum pixel
         (inclui /obrigado, /oferta e /metodocalma*, que ficam sem pixel). -->
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, "") || "/";
        var ids = {
          root: "%VITE_META_PIXEL_ID%",
          map: "%VITE_META_PIXEL_ID_MAP%",
        };
        var groups = {
          root: [
            "/", "/essencialab", "/funcionalidades", "/sinais",
            "/termos-de-uso", "/politica-de-privacidade", "/lgpd",
            "/contato", "/central-de-ajuda", "/status-do-sistema",
          ],
          // Renal trata de condição de saúde: nunca o pixel da raiz.
          // /map aqui só vale no dev; em produção o /map é servido pelo map.html.
          map: ["/map", "/precos", "/renal", "/renal/obrigado", "/webinar"],
        };
        var matches = function (list) {
          for (var i = 0; i < list.length; i++) {
            if (path === list[i]) return true;
          }
          return false;
        };
        var group = matches(groups.root) ? "root" : matches(groups.map) ? "map" : null;
        if (!group) return;
        var pixelId = ids[group];
        if (!/^\d+$/.test(pixelId)) {
          console.warn("[Meta Pixel] ID ausente para as rotas '" + group + "'; pixel não iniciado.");
          return;
        }

        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = true;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = true;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(
          window,
          document,
          "script",
          "https://connect.facebook.net/en_US/fbevents.js",
        );

        fbq("init", pixelId);
        fbq("track", "PageView");
        window.__renalCompleteRegistration = function () {
          fbq("track", "CompleteRegistration");
        };
      })();
    </script>
  </head>
  <body>
    <!-- Noscript do Meta Pixel removido para evitar carregamento de ID incorreto
         e duplicidade de pixels. -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- AOS Script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Hidden form for Netlify crawler – não remover -->
    <form name="guia-essencialab" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="especialidade" />
    </form>
  </body>
</html>
