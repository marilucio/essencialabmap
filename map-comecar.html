    <!-- Meta Pixel da /map (VITE_META_PIXEL_ID_MAP; o vite build falha se faltar).
         PageView aqui; ViewContent, Lead (com eventID) e StartTrial saem de
         src/pages/map/funil/tracking.ts. -->
    <script>
      (function () {
      var pixelId = "%VITE_META_PIXEL_ID_MAP%";
      if (!/^\d+$/.test(pixelId)) {
        console.warn("[Meta Pixel] VITE_META_PIXEL_ID_MAP ausente; pixel não iniciado.");
        return;
      }
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = true;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", pixelId);
      fbq("track", "PageView");
      })();
    </script>

    <!-- Microsoft Clarity só no funil (VITE_CLARITY_ID_MAP). Sem o ID, não carrega.
         Eventos mapf_<tela>, mapf_cadastro, mapf_plano_<eixo>, mapf_card_<plano>.
         E-mail, nome e o título com o nome usam data-clarity-mask. -->
    <script>
      (function () {
      var clarityId = "%VITE_CLARITY_ID_MAP%";
      if (!/^[a-z0-9]+$/i.test(clarityId)) {

        t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", clarityId);
      })();
    </script>
